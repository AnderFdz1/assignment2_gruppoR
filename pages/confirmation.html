<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="confirmation.title">Thank you for your support | Idea Ginger</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="confirmation-page">
    <header class="site-header">
        <div class="main-header"><div class="header-left"><label class="search-projects"><span class="search-icon">⌕</span><input type="search" class="search-input" data-i18n-placeholder="nav.searchPlaceholder" placeholder="Search for a project"></label><a href="../index.html#launch-campaign" class="campaign-button" data-i18n="nav.launch">Launch a Campaign</a></div><a href="../index.html" class="brand">Idea Ginger</a><nav class="utility-nav" aria-label="Utility navigation"><a href="../index.html#faq" data-i18n="nav.faq">FAQ</a><a href="../index.html#contact" data-i18n="nav.contact">Contact</a><a href="../index.html#services" data-i18n="nav.services">Services</a><a href="../index.html#login" data-i18n="nav.login">Login</a><div class="language-selector"><button class="language-button" type="button" aria-label="Change language" aria-expanded="false"><span id="current-language">EN</span><span class="language-arrow">▾</span></button><div class="language-dropdown"><button type="button" data-language="en">🇬🇧 English</button><button type="button" data-language="it">🇮🇹 Italiano</button></div></div></nav></div>
        <div class="section-bar"><nav aria-label="Main sections"><a href="../index.html" data-i18n="nav.home">Home</a><a href="explore.html" data-i18n="nav.explore">Explore Projects</a></nav></div>
    </header>
    <main class="confirmation-main"><div class="confirmation-card"><span class="confirmation-icon" aria-hidden="true">✓</span><p class="eyebrow">FUNDS TOGETHER</p><h1 data-i18n="confirmation.title">Thank you for your support!</h1><p class="lead" data-i18n="confirmation.subtitle">Your contribution can make a difference.</p><p data-i18n="confirmation.message">Your support helps this research project move forward.</p><p class="confirmation-amount" id="confirmationAmount"></p><div class="confirmation-actions"><a class="primary-button" href="../index.html" data-i18n="confirmation.backHome">Back to Home</a><a class="secondary-button" href="explore.html" data-i18n="confirmation.explore">Explore other projects</a></div></div></main>
    <script src="../js/language.js"></script>
    <script>
        const savedContribution = sessionStorage.getItem("supportAmount");
        const amountElement = document.getElementById("confirmationAmount");
        if (savedContribution) amountElement.textContent = `${getTranslation("support.total", document.documentElement.lang)}: €${savedContribution}`;
        document.addEventListener("languagechange", event => { if (savedContribution) amountElement.textContent = `${getTranslation("support.total", event.detail.language)}: €${savedContribution}`; });
    </script>
</body>
</html>
